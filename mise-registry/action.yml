name: Register in mise registry
description: Open an auto-merging pull request that adds a published release to chunkzero/mise-registry.

inputs:
  tool:
    description: Tool name; archives must be named `<tool>-<version>-<platform>.tar.gz`.
    required: true
  version:
    description: Published release version, without the leading v.
    required: true
  directory:
    description: Directory holding the published archives and their `.sha256` files.
    required: true
  token:
    description: GitHub App installation token with contents and pull request write access to chunkzero/mise-registry.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ inputs.version }}
        DIRECTORY: ${{ inputs.directory }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../release.py" registry-entry --tool "$TOOL" --version "$VERSION" \
          --directory "$DIRECTORY" > "$RUNNER_TEMP/entry.json"
        branch="$TOOL-$VERSION"
        existing=$(gh pr list --repo chunkzero/mise-registry --head "$branch" --state all --json url --jq '.[0].url // empty')
        if [ -n "$existing" ]; then
          echo "$existing"
          exit 0
        fi
        gh auth setup-git
        git clone --quiet https://github.com/chunkzero/mise-registry "$RUNNER_TEMP/mise-registry"
        cd "$RUNNER_TEMP/mise-registry"
        if ! python3 scripts/registry.py add "$TOOL" "$RUNNER_TEMP/entry.json"; then
          echo "::error::the registry rejected $TOOL $VERSION"
          exit 1
        fi
        if git diff --quiet; then
          echo "$TOOL $VERSION is already registered"
          exit 0
        fi
        git switch --quiet -c "$branch"
        git config user.name "chunkzero-registry[bot]"
        git config user.email "chunkzero-registry[bot]@users.noreply.github.com"
        git commit --quiet -am "feat: add $TOOL $VERSION"
        git push --quiet origin "$branch"
        url=$(gh pr create --repo chunkzero/mise-registry --head "$branch" --title "feat: add $TOOL $VERSION" \
          --body "Registers https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION.")
        gh pr merge "$url" --auto --squash
        echo "$url"
