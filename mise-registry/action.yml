name: Register in mise registry
description: Add a published release to chunkzero/mise-registry through an auto-merging pull request, and wait for it to merge.

inputs:
  tool:
    description: Tool name; archives must be named `<tool>-<version>-<platform>.tar.gz`.
    required: true
  version:
    description: Published release version, without the leading v.
    required: true
  directory:
    description: Directory holding the published archives and their `.sha256` files.
    required: true
  token:
    description: GitHub App installation token with contents and pull request write access to chunkzero/mise-registry.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TOOL: ${{ inputs.tool }}
        VERSION: ${{ inputs.version }}
        DIRECTORY: ${{ inputs.directory }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../release.py" registry-entry --tool "$TOOL" --version "$VERSION" \
          --directory "$DIRECTORY" > "$RUNNER_TEMP/$TOOL-$VERSION.json"
        branch="$TOOL-$VERSION"
        # Waiting for the merge keeps a tool's registrations in order, since each one rewrites the tool's file.
        merge() {
          gh pr merge "$1" --auto --squash
          for _ in $(seq 120); do
            case "$(gh pr view "$1" --json state --jq .state)" in
              MERGED) echo "registered: $1"; return 0 ;;
              CLOSED) echo "::error::$1 was closed without merging"; return 1 ;;
            esac
            sleep 10
          done
          echo "::error::$1 didn't merge within 20 minutes; check its Validate run"
          return 1
        }
        # Finish any earlier registration of this tool first, e.g. one a cancelled run left open.
        earlier=$(gh pr list --repo chunkzero/mise-registry --state open --limit 1000 --json headRefName,url \
          --jq ".[] | select(.headRefName != \"$branch\" and (.headRefName | test(\"^$TOOL-[0-9]\"))) | .url")
        for url in $earlier; do
          merge "$url"
        done
        pr=$(gh pr list --repo chunkzero/mise-registry --head "$branch" --state all --json url,state \
          --jq '.[0] // empty | "\(.state) \(.url)"')
        case "$pr" in
          MERGED*) echo "$TOOL $VERSION is already registered: ${pr#* }"; exit 0 ;;
          OPEN*) merge "${pr#* }"; exit ;;
          CLOSED*) echo "::error::the registry PR for $TOOL $VERSION was closed without merging: ${pr#* }"; exit 1 ;;
        esac
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        gh auth setup-git
        git clone --quiet https://github.com/chunkzero/mise-registry "$work"
        cd "$work"
        # A previous run may have pushed the branch and failed before opening its pull request.
        if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
          python3 scripts/registry.py add "$TOOL" "$RUNNER_TEMP/$TOOL-$VERSION.json"
          if git diff --quiet; then
            echo "$TOOL $VERSION is already registered"
            exit 0
          fi
          git switch --quiet -c "$branch"
          git config user.name "chunkzero-registry[bot]"
          git config user.email "chunkzero-registry[bot]@users.noreply.github.com"
          git commit --quiet -am "feat: add $TOOL $VERSION"
          git push --quiet origin "$branch"
        fi
        url=$(gh pr create --repo chunkzero/mise-registry --head "$branch" --title "feat: add $TOOL $VERSION" \
          --body "Registers https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION.")
        merge "$url"
